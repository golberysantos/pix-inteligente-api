# ================================
# Configuracoes da Aplicacao
# ================================
spring.application.name=pix-inteligente-api
server.port=8080

# ================================
# Banco de Dados H2 em Memoria
# ================================
# Estrutura com variaveis de ambiente \u2014 ${VARIAVEL:valor_padrao}
# Sem a variavel definida, usa o valor apos ':' (H2 em memoria).
# Em producao, defina as variaveis no ambiente para sobrescrever
# sem precisar alterar este arquivo.
#
# Exemplos:
# Windows : set DB_URL=jdbc:postgresql://localhost:5432/pixdb
# Linux   : export DB_URL=jdbc:postgresql://localhost:5432/pixdb
# Docker  : -e DB_URL=jdbc:postgresql://localhost:5432/pixdb
spring.datasource.url=${DB_URL:jdbc:h2:mem:pixdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ================================
# Console H2
# Disponivel em: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:pixdb
# Usuario: sa | Senha: (vazio)
# ================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ================================
# JPA / Hibernate
# ================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ================================
# Springdoc OpenAPI / Swagger UI
# Disponivel em: http://localhost:8080/swagger-ui/index.html
# ================================
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# ================================
# Gemini API
# Em producao, defina as variaveis de ambiente:
# Windows : set GEMINI_API_KEY=sua_chave_aqui
# Linux   : export GEMINI_API_KEY=sua_chave_aqui
# Docker  : -e GEMINI_API_KEY=sua_chave_aqui
# ================================
# gemini.api.url=${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent}
# gemini.api.key=${GEMINI_API_KEY:}

# ================================
# Logs
# ================================
logging.level.br.com.pixinteligente=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG