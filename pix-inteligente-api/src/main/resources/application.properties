# ================================
# Configuracoes da Aplicacao
# ================================
spring.application.name=pix-inteligente-api
server.port=8080

# ================================
# Banco de Dados H2 em Memoria
# ================================
spring.datasource.url=jdbc:h2:mem:pixdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ================================
# Console H2
# Disponivel em: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:pixdb
# Usuario: sa | Senha: (vazio)
# ================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ================================
# JPA / Hibernate
# ================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ================================
# Springdoc OpenAPI / Swagger UI
# Disponivel em: http://localhost:8080/swagger-ui/index.html
# ================================
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# ================================
# Gemini API (configurar quando disponivel)
# ================================
# gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent
# gemini.api.key=SUA_API_KEY_AQUI

# ================================
# Logs
# ================================
logging.level.br.com.pixinteligente=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG