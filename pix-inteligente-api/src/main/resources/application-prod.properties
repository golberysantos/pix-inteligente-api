# ================================
# Profile: Producao (prod)
# ================================
# Ative este profile com:
# - Terminal: export SPRING_PROFILES_ACTIVE=prod
# - Docker  : -e SPRING_PROFILES_ACTIVE=prod
#
# IMPORTANTE:
# Em producao, NUNCA coloque credenciais explicitas neste arquivo.
# Sempre use variaveis de ambiente definidas no servidor,
# no Docker, no Kubernetes ou no servico de CI/CD.
# ================================

# Banco de Dados PostgreSQL via variaveis de ambiente
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate com PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console desabilitado em producao
spring.h2.console.enabled=false

# Swagger desabilitado em producao
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Gemini API via variaveis de ambiente
gemini.api.url=${GEMINI_URL}
gemini.api.key=${GEMINI_API_KEY}

# Logs minimos em producao
logging.level.br.com.pixinteligente=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
