# ================================
# Profile: Desenvolvimento (dev)
# ================================
# Ative este profile com:
# - IDE     : VM arguments: -Dspring.profiles.active=dev
# - Maven   : mvn spring-boot:run -Dspring-boot.run.profiles=dev
# - Terminal: export SPRING_PROFILES_ACTIVE=dev
#
# AVISO DE BOAS PRATICAS:
# Este arquivo contem credenciais explicitas para facilitar
# testes do desafio de projeto. Em um ambiente real,
# substitua os valores por variaveis de ambiente:
#
# spring.datasource.url      = ${DB_URL}
# spring.datasource.username = ${DB_USERNAME}
# spring.datasource.password = ${DB_PASSWORD}
#
# E defina as variaveis no ambiente:
# Windows : set DB_URL=jdbc:postgresql://localhost:5432/pixdb
# Linux   : export DB_URL=jdbc:postgresql://localhost:5432/pixdb
# Docker  : -e DB_URL=jdbc:postgresql://localhost:5432/pixdb
# ================================

# Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pixdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate com PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console desabilitado em dev com PostgreSQL
spring.h2.console.enabled=false

# Logs mais detalhados em desenvolvimento
logging.level.br.com.pixinteligente=DEBUG
logging.level.org.springframework.security=INFO
